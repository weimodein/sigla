<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Widest-support format first, best-looking one last: among the entries a
         browser can decode it takes the last, so modern ones paint the vector
         icon while older ones (some Safari versions, Windows shell chrome) stop
         at a raster format they understand instead of their own default. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-256.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon-256.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>SIGLA Admin Panel</title>
  </head>
  <body>

  </body>
</html>
