[pytest]
# rootdir on sys.path so `from app.utils...` and `from tests.test_parity import ...`
# resolve without an editable install.
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers

# TensorFlow logs a wall of INFO/deprecation noise on import. These tests exercise
# preprocessor/extract only (no TF import), but train.py pulls it in transitively if
# a future test touches it.
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
